<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#eafff4}#cockpit{position:relative;width:100vw;height:100dvh;background:#020806 url('assets/xuvish-cockpit.jpg?v=6') center/cover no-repeat;overflow:hidden}.hot{position:absolute;background:transparent;border:0;cursor:pointer}.hot:active{background:rgba(57,255,136,.12);box-shadow:inset 0 0 24px rgba(57,255,136,.28);border-radius:16px}.livebox{position:absolute;background:rgba(1,10,7,.92);border:1px solid rgba(57,255,136,.28);border-radius:11px;color:#ecfff5;text-shadow:0 0 10px rgba(57,255,136,.25)}#timebox{left:1.5%;top:1.5%;width:14.3%;height:8.7%;padding:.75% 1.05%}.time{font-size:clamp(22px,3.05vw,52px);font-weight:780;line-height:.95}.date{font-size:clamp(9px,1vw,16px);margin-top:5px;color:#caffdf}#wxbox{left:16.3%;top:1.5%;width:14.2%;height:8.7%;padding:.6% .9%;display:flex;align-items:center;gap:8px}.wxicon{font-size:clamp(20px,2.6vw,42px)}.temp{font-size:clamp(21px,2.85vw,48px);font-weight:760}.wxsub{font-size:clamp(8px,.8vw,12px);color:#bfffd8}#speedLive{position:absolute;left:69.6%;top:56.2%;width:27.7%;height:18.6%;display:flex;align-items:center;justify-content:center;pointer-events:none}.speednum{font-size:clamp(45px,6.6vw,110px);font-weight:880;line-height:.8}.speedunit{font-size:clamp(8px,.8vw,12px);letter-spacing:.23em;color:#b2ffd1;text-align:center;margin-top:5px}.gps{position:absolute;right:4%;top:17%;font-size:clamp(7px,.72vw,11px);color:#8affbd}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#39ff88;box-shadow:0 0 9px #39ff88;margin-right:5px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.91);z-index:50}.modal.show{display:flex}.modalcard{width:min(900px,94vw);padding:24px;border:1px solid rgba(57,255,136,.45);border-radius:22px;background:linear-gradient(180deg,#04150e,#010806)}.big{font-size:min(30vw,260px);font-weight:900;line-height:.82;text-align:center}.center{text-align:center}.btn{border:1px solid rgba(57,255,136,.45);background:#071d13;color:#eafff4;border-radius:14px;padding:12px 18px;margin:8px;font-weight:700}.toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%) translateY(20px);opacity:0;background:#061b12;border:1px solid rgba(57,255,136,.45);padding:10px 15px;border-radius:12px;transition:.18s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><div id="cockpit">
<div id="timebox" class="livebox"><div class="time" id="clock">--:--</div><div class="date" id="date">---</div></div><div id="wxbox" class="livebox"><div class="wxicon">☁︎</div><div><div class="temp"><span id="temp">--</span>°</div><div class="wxsub">AGRA · <span id="wx">GPS</span></div></div></div><div id="speedLive"><div class="center"><div class="speednum" id="speed">0</div><div class="speedunit">KM/H · GPS SPEED</div></div><div class="gps"><span class="dot"></span><span id="gpsState">ACQUIRING GPS</span><br>Accuracy <span id="acc">--</span> m</div></div>
<button class="hot" style="left:1.2%;top:12.7%;width:29.3%;height:47.8%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox vehicle status…')"></button><button class="hot" style="left:31.0%;top:12.5%;width:37.9%;height:54.9%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button>
<button class="hot" style="left:69.5%;top:14%;width:9%;height:13.4%" onclick="shortcut('CAR WINDOWS','Windows')"></button><button class="hot" style="left:79%;top:14%;width:8.7%;height:13.4%" onclick="shortcut('CAR CLIMATE','Climate')"></button><button class="hot" style="left:88.2%;top:14%;width:8.7%;height:13.4%" onclick="shortcut('CAR STOP ENGINE','Engine')"></button><button class="hot" style="left:69.5%;top:28%;width:9%;height:13.3%" onclick="shortcut('CAR HAZARD','Hazard')"></button><button class="hot" style="left:79%;top:28%;width:8.7%;height:13.3%" onclick="shortcut('CAR CENTRAL LOCK','Central Lock')"></button><button class="hot" style="left:88.2%;top:28%;width:8.7%;height:13.3%" onclick="shortcut('CAR HEAD LAMP','Head Lamp')"></button><button class="hot" style="left:69.5%;top:42%;width:9%;height:13.1%" onclick="shortcut('CAR HORN BLINK','Horn & Blink')"></button><button class="hot" style="left:79%;top:42%;width:8.7%;height:13.1%" onclick="shortcut('CAR SKYROOF','Skyroof')"></button><button class="hot" style="left:88.2%;top:42%;width:8.7%;height:13.1%" onclick="shortcut('OPEN ADRENOX','More vehicle controls')"></button><button class="hot" style="left:68.8%;top:55.3%;width:28.5%;height:20.1%" onclick="openSpeed()"></button>
<button class="hot" style="left:1.2%;top:78.8%;width:13.2%;height:11.9%" onclick="openURL('maps://','Opening Apple Maps…')"></button><button class="hot" style="left:14.8%;top:78.8%;width:13.2%;height:11.9%" onclick="openURL('music://','Opening Apple Music…')"></button><button class="hot" style="left:28.5%;top:78.8%;width:13.2%;height:11.9%" onclick="startGPS();toast('XUVISH DRIVE active')"></button><button class="hot" style="left:42.2%;top:78.8%;width:13.2%;height:11.9%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button><button class="hot" style="left:55.9%;top:78.8%;width:13.2%;height:11.9%" onclick="shortcut('OPEN DASHCAM','Opening Dashcam…')"></button><button class="hot" style="left:69.7%;top:78.8%;width:13.2%;height:11.9%" onclick="openSpeed()"></button><button class="hot" style="left:83.4%;top:78.8%;width:13.2%;height:11.9%" onclick="shortcut('OPEN NEXT DASHBOARD','Opening app bay…')"></button></div>
<div class="modal" id="speedModal" onclick="this.classList.remove('show')"><div class="modalcard" onclick="event.stopPropagation()"><div class="center" style="letter-spacing:.25em;color:#8affbd;font-weight:800">XUVISH LIVE GPS SPEED</div><div class="big" id="bigSpeed">0</div><div class="center" style="letter-spacing:.35em;color:#9dffc9">KM/H</div><div class="center" style="margin-top:14px;color:#9dd3b2">Accuracy <span id="bigAcc">--</span> m · Heading <span id="heading">--</span>°</div><div class="center"><button class="btn" onclick="document.getElementById('speedModal').classList.remove('show')">CLOSE</button><button class="btn" onclick="shortcut('OPEN NEXT DASHBOARD','Opening Next Car Dashboard…')">NEXT DASHBOARD</button></div></div></div><div id="toast" class="toast"></div>
<script>let watchId=null,last=null;function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});date.textContent=d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',year:'numeric'})}setInterval(tick,1000);tick();function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}function openURL(u,m){toast(m);setTimeout(()=>location.href=u,100)}function shortcut(n,m){toast(m);setTimeout(()=>location.href='shortcuts://run-shortcut?name='+encodeURIComponent(n),100)}function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,d1=r(b.latitude-a.latitude),d2=r(b.longitude-a.longitude),s1=r(a.latitude),s2=r(b.latitude),q=Math.sin(d1/2)**2+Math.cos(s1)*Math.cos(s2)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function gps(p){const c=p.coords,now=p.timestamp||Date.now();let k=(typeof c.speed==='number'&&c.speed>=0)?c.speed*3.6:null;if((k===null||!isFinite(k))&&last){const dt=(now-last.t)/1000;if(dt>.3&&dt<10)k=hav(last.c,c)/dt*3.6}if(k===null||!isFinite(k)||k<1.2)k=0;const v=Math.round(k);speed.textContent=v;bigSpeed.textContent=v;const a=Math.round(c.accuracy||0);acc.textContent=a;bigAcc.textContent=a;heading.textContent=(c.heading>=0?Math.round(c.heading):'--');gpsState.textContent=a<=20?'GPS LOCKED':'GPS SIGNAL';last={c:{latitude:c.latitude,longitude:c.longitude},t:now};if(!window._wx){window._wx=true;fetchWeather(c.latitude,c.longitude)}}function startGPS(){if(!navigator.geolocation){toast('GPS unavailable');return}if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(gps,()=>{gpsState.textContent='ALLOW LOCATION';toast('Allow Location for live speed')},{enableHighAccuracy:true,maximumAge:250,timeout:12000})}async function fetchWeather(lat,lon){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`);const j=await r.json();temp.textContent=Math.round(j.current.temperature_2m);wx.textContent='LIVE'}catch(e){}}function openSpeed(){document.getElementById('speedModal').classList.add('show');startGPS()}window.addEventListener('load',startGPS);</script></body></html>
