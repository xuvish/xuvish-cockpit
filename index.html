<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#010705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XUVISH">
<link rel="manifest" href="manifest.webmanifest">
<title>XUVISH Digital Cockpit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#effff7}body{display:flex;align-items:center;justify-content:center}button{font:inherit;color:inherit}
#stage{position:relative;width:min(100vw,177.6833156vh);height:min(100vh,56.2799043vw);aspect-ratio:1672/941;background:#010705 url('assets/5B965B88-9979-426F-9006-7554A04100BA.png?v=300') center/100% 100% no-repeat;overflow:hidden}
.hot{position:absolute;border:0;background:transparent;z-index:6;padding:0}.hot:active{background:rgba(35,255,170,.10);box-shadow:inset 0 0 24px rgba(35,255,170,.20);border-radius:16px}
.livebox{position:absolute;z-index:5;background:linear-gradient(145deg,rgba(0,18,12,.985),rgba(0,7,5,.985));border:1px solid rgba(39,255,177,.45);box-shadow:inset 0 0 16px rgba(39,255,177,.03);color:#f3fff8}
#liveTime{left:1.25%;top:2.0%;width:12.15%;height:9.0%;border-radius:14px;padding:.82% 1.15%;display:flex;flex-direction:column;justify-content:center}.time{font-size:clamp(20px,2.75vw,47px);font-weight:800;line-height:.9}.date{font-size:clamp(7px,.78vw,12px);margin-top:7px;color:#d6ffea}
#liveWeather{left:14.35%;top:2.0%;width:14.8%;height:9.0%;border-radius:14px;padding:.65% 1.0%;display:flex;align-items:center;gap:10px}.wxIcon{font-size:clamp(20px,2.2vw,36px)}.temp{font-size:clamp(23px,2.85vw,48px);font-weight:800;line-height:1}.wxText{font-size:clamp(7px,.72vw,11px);line-height:1.45;color:#e2fff0}
#liveSpeed{left:76.35%;top:65.7%;width:14.4%;height:10.4%;background:rgba(0,10,7,.96);border:0;border-radius:44% 44% 0 0;display:flex;flex-direction:column;justify-content:center;align-items:center}.speed{font-size:clamp(34px,4.35vw,72px);font-weight:900;line-height:.78}.unit{font-size:clamp(7px,.65vw,10px);letter-spacing:.08em}.gps{position:absolute;right:2.2%;top:62.15%;z-index:7;font-size:clamp(7px,.65vw,10px);color:#43ff9f;letter-spacing:.06em;background:rgba(0,12,8,.84);padding:4px 7px;border-radius:8px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34ff91;box-shadow:0 0 10px #34ff91;margin-right:5px}
#toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%) translateY(18px);opacity:0;z-index:50;border:1px solid rgba(39,255,177,.48);background:#04160e;padding:10px 16px;border-radius:12px;transition:.18s;font-size:13px}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.93);z-index:60}.modal.show{display:flex}.card{width:min(850px,92vw);padding:25px;border:1px solid rgba(39,255,177,.5);border-radius:22px;background:#03110b;text-align:center;box-shadow:0 0 40px rgba(0,255,160,.13)}.big{font-size:min(30vw,250px);font-weight:900;line-height:.82}.sub{letter-spacing:.28em;color:#8affc8;margin:12px 0}.btn{border:1px solid rgba(39,255,177,.45);background:#071f14;color:white;border-radius:13px;padding:12px 18px;margin:8px}.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.appbtn{border:1px solid rgba(39,255,177,.35);background:#061a11;border-radius:12px;padding:16px;color:#dffff0}
</style>
</head>
<body>
<div id="stage">
  <div id="liveTime" class="livebox"><div class="time" id="clock">--:--</div><div class="date" id="date">---</div></div>
  <div id="liveWeather" class="livebox" onclick="refreshWeather()"><div class="wxIcon">☁︎</div><div><div class="temp"><span id="temp">--</span>°</div><div class="wxText">Agra<br><span id="wx">LIVE</span></div></div></div>
  <div id="liveSpeed"><div class="speed" id="speed">0</div><div class="unit">km/h</div></div>
  <div class="gps"><span class="dot"></span><span id="gpsState">GPS</span></div>

  <button class="hot" aria-label="Vehicle Status" style="left:1.2%;top:13.3%;width:29.4%;height:54.8%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox vehicle status…')"></button>
  <button class="hot" aria-label="Center Vehicle" style="left:30.9%;top:12.7%;width:37.7%;height:63.2%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button>

  <button class="hot" aria-label="Windows" style="left:70.0%;top:21.7%;width:8.4%;height:12.6%" onclick="shortcut('CAR WINDOWS','Windows control')"></button>
  <button class="hot" aria-label="Climate" style="left:79.0%;top:21.7%;width:9.2%;height:12.6%" onclick="shortcut('CAR CLIMATE','Climate control')"></button>
  <button class="hot" aria-label="Stop Engine" style="left:89.1%;top:21.7%;width:8.1%;height:12.6%" onclick="shortcut('CAR STOP ENGINE','Engine control')"></button>
  <button class="hot" aria-label="Hazard" style="left:70.0%;top:35.2%;width:8.4%;height:12.7%" onclick="shortcut('CAR HAZARD','Hazard control')"></button>
  <button class="hot" aria-label="Adrenox Center" style="left:79.0%;top:35.1%;width:9.2%;height:12.9%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button>
  <button class="hot" aria-label="Central Lock" style="left:89.1%;top:35.2%;width:8.1%;height:12.7%" onclick="shortcut('CAR CENTRAL LOCK','Central lock')"></button>
  <button class="hot" aria-label="Horn and Blink" style="left:70.0%;top:49.3%;width:8.4%;height:12.1%" onclick="shortcut('CAR HORN BLINK','Horn and blink')"></button>
  <button class="hot" aria-label="Skyroof" style="left:79.0%;top:49.3%;width:9.2%;height:12.1%" onclick="shortcut('CAR SKYROOF','Skyroof')"></button>
  <button class="hot" aria-label="Head Lamp" style="left:89.1%;top:49.3%;width:8.1%;height:12.1%" onclick="shortcut('CAR HEAD LAMP','Head lamp')"></button>

  <button class="hot" aria-label="GPS Speed" style="left:69.0%;top:61.0%;width:29.0%;height:17.8%" onclick="openSpeed()"></button>

  <button class="hot" aria-label="Navigation" style="left:1.2%;top:80.3%;width:13.0%;height:11.4%" onclick="openURL('maps://','Opening Apple Maps…')"></button>
  <button class="hot" aria-label="Apple Music" style="left:15.1%;top:80.3%;width:13.0%;height:11.4%" onclick="openURL('music://','Opening Apple Music…')"></button>
  <button class="hot" aria-label="Drive" style="left:29.0%;top:80.3%;width:13.0%;height:11.4%" onclick="startDrive()"></button>
  <button class="hot" aria-label="Adrenox" style="left:42.8%;top:80.3%;width:13.6%;height:11.4%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button>
  <button class="hot" aria-label="Dashcam" style="left:57.1%;top:80.3%;width:13.0%;height:11.4%" onclick="shortcut('OPEN DASHCAM','Opening Dashcam…')"></button>
  <button class="hot" aria-label="Speed" style="left:71.0%;top:80.3%;width:13.0%;height:11.4%" onclick="openSpeed()"></button>
  <button class="hot" aria-label="More" style="left:84.9%;top:80.3%;width:13.0%;height:11.4%" onclick="openMore()"></button>
</div>

<div id="speedModal" class="modal" onclick="closeModal('speedModal')"><div class="card" onclick="event.stopPropagation()"><div class="sub">XUVISH · LIVE GPS SPEED</div><div class="big" id="bigSpeed">0</div><div class="sub">KM/H</div><div>Accuracy <span id="acc">--</span> m · Heading <span id="heading">--</span>°</div><div><button class="btn" onclick="closeModal('speedModal')">CLOSE</button><button class="btn" onclick="shortcut('OPEN NEXT DASHBOARD','Opening speed app…')">SPEED APP</button></div></div></div>
<div id="moreModal" class="modal" onclick="closeModal('moreModal')"><div class="card" onclick="event.stopPropagation()"><div class="sub">XUVISH · APP BAY</div><div class="apps"><button class="appbtn" onclick="shortcut('OPEN CAR SCANNER','Opening Car Scanner…')">CAR SCANNER</button><button class="appbtn" onclick="shortcut('OPEN REALDASH','Opening RealDash…')">REALDASH</button><button class="appbtn" onclick="shortcut('OPEN NEXT DASHBOARD','Opening Next Dashboard…')">NEXT DASHBOARD</button><button class="appbtn" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')">ADRENOX</button></div><button class="btn" onclick="closeModal('moreModal')">CLOSE</button></div></div>
<div id="toast"></div>
<script>
let watchId=null,last=null;
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',year:'numeric'})}setInterval(tick,1000);tick();
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function openURL(u,m){toast(m);setTimeout(()=>location.href=u,120)}
function shortcut(n,m){toast(m);setTimeout(()=>location.href='shortcuts://run-shortcut?name='+encodeURIComponent(n),120)}
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,d1=r(b.latitude-a.latitude),d2=r(b.longitude-a.longitude),s1=r(a.latitude),s2=r(b.latitude),q=Math.sin(d1/2)**2+Math.cos(s1)*Math.cos(s2)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function gps(p){const c=p.coords,now=p.timestamp||Date.now();let k=(typeof c.speed==='number'&&c.speed>=0)?c.speed*3.6:null;if((k===null||!isFinite(k))&&last){const dt=(now-last.t)/1000;if(dt>.3&&dt<10)k=hav(last.c,c)/dt*3.6}if(k===null||!isFinite(k)||k<1.2)k=0;const v=Math.round(k);document.getElementById('speed').textContent=v;document.getElementById('bigSpeed').textContent=v;document.getElementById('acc').textContent=Math.round(c.accuracy||0);document.getElementById('heading').textContent=(typeof c.heading==='number'&&c.heading>=0)?Math.round(c.heading):'--';document.getElementById('gpsState').textContent=(c.accuracy||99)<=20?'GPS LOCKED':'GPS SIGNAL';last={c:{latitude:c.latitude,longitude:c.longitude},t:now};if(!window._wx){window._wx=true;fetchWeather(c.latitude,c.longitude)}}
function startGPS(){if(!navigator.geolocation){toast('GPS unavailable');return}if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(gps,()=>{document.getElementById('gpsState').textContent='ALLOW GPS';toast('Allow Location access for live speed')},{enableHighAccuracy:true,maximumAge:250,timeout:12000})}
function startDrive(){startGPS();toast('XUVISH DRIVE active')}
function openSpeed(){document.getElementById('speedModal').classList.add('show');startGPS()}
function openMore(){document.getElementById('moreModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
async function fetchWeather(lat,lon){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`);const j=await r.json();document.getElementById('temp').textContent=Math.round(j.current.temperature_2m);document.getElementById('wx').textContent='LIVE'}catch(e){document.getElementById('wx').textContent='GPS'}}
function refreshWeather(){window._wx=false;startGPS();toast('Refreshing weather…')}
window.addEventListener('load',startGPS);
</script>
</body>
</html>
