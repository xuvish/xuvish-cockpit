<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#010705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XUVISH">
<link rel="manifest" href="manifest.webmanifest">
<title>XUVISH Digital Cockpit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#effff7}body{display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;background:#010705 url('assets/xuvish-cockpit.jpg?v=100') center/100% 100% no-repeat;overflow:hidden;box-shadow:0 0 70px rgba(0,255,150,.08)}.hot{position:absolute;border:0;background:transparent;z-index:5}.hot:active{background:rgba(35,255,170,.11);box-shadow:inset 0 0 22px rgba(35,255,170,.23);border-radius:14px}.mask{position:absolute;z-index:4;background:rgba(0,12,8,.96);color:#effff7}.timeMask{left:2.7%;top:2.0%;width:9.6%;height:7.2%;display:flex;flex-direction:column;justify-content:center;padding-left:.8%}.time{font-size:clamp(19px,2.5vw,43px);font-weight:760;line-height:.9}.date{font-size:clamp(7px,.72vw,11px);color:#d3ffe8;margin-top:5px}.weatherMask{left:15.5%;top:2.1%;width:11.1%;height:7.0%;display:flex;align-items:center;gap:8px;padding:0 .6%}.wx{font-size:clamp(18px,1.9vw,30px)}.temp{font-size:clamp(20px,2.5vw,42px);font-weight:760}.wxsub{font-size:clamp(7px,.65vw,10px);color:#d8ffeb}.speedMask{left:78.6%;top:65.4%;width:8.5%;height:8.7%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,10,7,.92);border-radius:50% 50% 0 0}.speed{font-size:clamp(32px,4.0vw,66px);font-weight:850;line-height:.8}.unit{font-size:clamp(7px,.62vw,10px);letter-spacing:.12em;color:#d8ffeb}.gpsMask{left:88.2%;top:61.0%;width:8.5%;height:3.2%;background:rgba(0,10,7,.88);font-size:clamp(7px,.63vw,10px);color:#42ff9e;display:flex;align-items:center;justify-content:center;letter-spacing:.08em}.dot{width:7px;height:7px;border-radius:50%;background:#36ff98;box-shadow:0 0 10px #36ff98;margin-right:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.card{width:min(850px,92vw);border:1px solid rgba(39,255,177,.5);background:#03110b;border-radius:22px;padding:24px;text-align:center;box-shadow:0 0 35px rgba(0,255,160,.13)}.big{font-size:min(30vw,250px);line-height:.82;font-weight:900}.sub{letter-spacing:.3em;color:#87ffc5;margin:12px 0}.btn{border:1px solid rgba(39,255,177,.45);background:#071f14;color:white;border-radius:13px;padding:12px 18px;margin:8px}.toast{position:fixed;left:50%;bottom:8%;transform:translateX(-50%) translateY(20px);opacity:0;background:#061b12;border:1px solid rgba(39,255,177,.5);border-radius:12px;padding:10px 16px;z-index:30;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="stage">
  <div class="mask timeMask"><div class="time" id="clock">--:--</div><div class="date" id="date">---</div></div>
  <div class="mask weatherMask" onclick="refreshWeather()"><div class="wx">☁︎</div><div><div class="temp"><span id="temp">--</span>°</div><div class="wxsub">Agra · <span id="wx">LIVE</span></div></div></div>
  <div class="mask speedMask"><div class="speed" id="speed">0</div><div class="unit">km/h</div></div>
  <div class="mask gpsMask"><span class="dot"></span><span id="gpsState">GPS</span></div>

  <button class="hot" aria-label="Vehicle status" style="left:1.2%;top:13.2%;width:29.1%;height:54.7%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox vehicle status…')"></button>
  <button class="hot" aria-label="Center vehicle" style="left:30.8%;top:12.7%;width:37.3%;height:63.1%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button>

  <button class="hot" style="left:70.0%;top:21.5%;width:8.2%;height:12.7%" onclick="shortcut('CAR WINDOWS','Windows control')"></button>
  <button class="hot" style="left:79.0%;top:21.5%;width:9.0%;height:12.7%" onclick="shortcut('CAR CLIMATE','Climate control')"></button>
  <button class="hot" style="left:89.1%;top:21.5%;width:8.1%;height:12.7%" onclick="shortcut('CAR STOP ENGINE','Engine control')"></button>
  <button class="hot" style="left:70.0%;top:35.2%;width:8.2%;height:12.7%" onclick="shortcut('CAR HAZARD','Hazard control')"></button>
  <button class="hot" style="left:79.0%;top:35.2%;width:9.0%;height:12.7%" onclick="shortcut('OPEN ADRENOX','Open Adrenox')"></button>
  <button class="hot" style="left:89.1%;top:35.2%;width:8.1%;height:12.7%" onclick="shortcut('CAR CENTRAL LOCK','Central lock')"></button>
  <button class="hot" style="left:70.0%;top:49.3%;width:8.2%;height:12.0%" onclick="shortcut('CAR HORN BLINK','Horn and blink')"></button>
  <button class="hot" style="left:79.0%;top:49.3%;width:9.0%;height:12.0%" onclick="shortcut('CAR SKYROOF','Skyroof')"></button>
  <button class="hot" style="left:89.1%;top:49.3%;width:8.1%;height:12.0%" onclick="shortcut('CAR HEAD LAMP','Head lamp')"></button>

  <button class="hot" aria-label="GPS speed" style="left:69.1%;top:61.1%;width:28.8%;height:17.7%" onclick="openSpeed()"></button>

  <button class="hot" aria-label="Navigation" style="left:1.2%;top:80.0%;width:13.0%;height:11.4%" onclick="openURL('maps://','Opening Apple Maps…')"></button>
  <button class="hot" aria-label="Apple Music" style="left:15.0%;top:80.0%;width:13.0%;height:11.4%" onclick="openURL('music://','Opening Apple Music…')"></button>
  <button class="hot" aria-label="Drive" style="left:28.9%;top:80.0%;width:13.0%;height:11.4%" onclick="startDrive()"></button>
  <button class="hot" aria-label="Adrenox" style="left:42.7%;top:80.0%;width:13.6%;height:11.4%" onclick="shortcut('OPEN ADRENOX','Opening Adrenox…')"></button>
  <button class="hot" aria-label="Dashcam" style="left:57.1%;top:80.0%;width:13.0%;height:11.4%" onclick="shortcut('OPEN DASHCAM','Opening Dashcam…')"></button>
  <button class="hot" aria-label="Speed" style="left:71.0%;top:80.0%;width:13.0%;height:11.4%" onclick="openSpeed()"></button>
  <button class="hot" aria-label="More" style="left:84.8%;top:80.0%;width:13.0%;height:11.4%" onclick="shortcut('OPEN NEXT DASHBOARD','Opening app bay…')"></button>
</div>

<div id="speedModal" class="modal" onclick="this.classList.remove('show')"><div class="card" onclick="event.stopPropagation()"><div class="sub">XUVISH · LIVE GPS SPEED</div><div class="big" id="bigSpeed">0</div><div class="sub">KM/H</div><div>Accuracy <span id="acc">--</span> m · Heading <span id="heading">--</span>°</div><div><button class="btn" onclick="document.getElementById('speedModal').classList.remove('show')">CLOSE</button><button class="btn" onclick="shortcut('OPEN NEXT DASHBOARD','Opening speed app…')">SPEED APP</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
let watchId=null,last=null;
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});date.textContent=d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',year:'numeric'})}setInterval(tick,1000);tick();
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function openURL(u,m){toast(m);setTimeout(()=>location.href=u,120)}
function shortcut(n,m){toast(m);setTimeout(()=>location.href='shortcuts://run-shortcut?name='+encodeURIComponent(n),120)}
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,d1=r(b.latitude-a.latitude),d2=r(b.longitude-a.longitude),s1=r(a.latitude),s2=r(b.latitude),q=Math.sin(d1/2)**2+Math.cos(s1)*Math.cos(s2)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function gps(p){const c=p.coords,now=p.timestamp||Date.now();let k=(typeof c.speed==='number'&&c.speed>=0)?c.speed*3.6:null;if((k===null||!isFinite(k))&&last){const dt=(now-last.t)/1000;if(dt>.3&&dt<10)k=hav(last.c,c)/dt*3.6}if(k===null||!isFinite(k)||k<1.2)k=0;const v=Math.round(k);speed.textContent=v;bigSpeed.textContent=v;acc.textContent=Math.round(c.accuracy||0);heading.textContent=(typeof c.heading==='number'&&c.heading>=0)?Math.round(c.heading):'--';gpsState.textContent=(c.accuracy||99)<=20?'GPS LOCKED':'GPS SIGNAL';last={c:{latitude:c.latitude,longitude:c.longitude},t:now};if(!window._wx){window._wx=true;fetchWeather(c.latitude,c.longitude)}}
function startGPS(){if(!navigator.geolocation){toast('GPS unavailable');return}if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(gps,()=>{gpsState.textContent='ALLOW GPS';toast('Allow Location access for live speed')},{enableHighAccuracy:true,maximumAge:250,timeout:12000})}
function startDrive(){startGPS();toast('XUVISH DRIVE active')}
function openSpeed(){document.getElementById('speedModal').classList.add('show');startGPS()}
async function fetchWeather(lat,lon){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`);const j=await r.json();temp.textContent=Math.round(j.current.temperature_2m);wx.textContent='LIVE'}catch(e){wx.textContent='GPS'}}
function refreshWeather(){window._wx=false;startGPS();toast('Refreshing weather…')}
window.addEventListener('load',startGPS);
</script>
</body></html>
